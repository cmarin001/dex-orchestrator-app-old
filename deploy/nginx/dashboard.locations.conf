# Include inside the droplet's HTTPS server block.
# Replace its existing location /api/, location = /, and location /.
# Keep the TLS, response headers, and existing "api" limit_req_zone.
root /opt/dex-orchestrator-app/dist;
index index.html;

location / {
    try_files $uri $uri/ /index.html;
}

location /assets/ {
    try_files $uri =404;
}

location ^~ /api/ {
    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_pass http://127.0.0.1:8787;
}

location = /trades {
    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;
    proxy_set_header Authorization $http_authorization;
    proxy_pass http://127.0.0.1:8787;
}

location = /live-view/stream {
    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 75s;
    proxy_pass http://127.0.0.1:8787;
}
