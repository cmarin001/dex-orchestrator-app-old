services:
  dashboard:
    image: ${DASHBOARD_IMAGE:-dex-orchestrator-app:local}
    build:
      context: .
      args:
        VITE_EXPECTED_CYCLE_INTERVAL_MS: ${VITE_EXPECTED_CYCLE_INTERVAL_MS:-90000}
    ports:
      - "127.0.0.1:8081:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
