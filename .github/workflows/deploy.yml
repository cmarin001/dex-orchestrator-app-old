name: deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            VITE_DASHBOARD_AUTH_MODE=${{ vars.DASHBOARD_AUTH_MODE || 'legacy' }}
            VITE_EXPECTED_CYCLE_INTERVAL_MS=${{ vars.EXPECTED_CYCLE_INTERVAL_MS || '90000' }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        if: vars.DASHBOARD_AUTH_MODE == 'auth0'
        with:
          context: .
          target: bff
          build-args: BUILD_VERSION=${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ghcr.io/${{ github.repository }}-bff:${{ github.sha }}
          cache-from: type=gha,scope=bff
          cache-to: type=gha,mode=max,scope=bff

  deploy:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ${{ vars.PRODUCTION_DEPLOY_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 35
    environment:
      name: production
      url: https://dex-orchestrator.best
    outputs:
      result: ${{ steps.remote.outputs.result }}
    steps:
      - name: Run approved deployment on the droplet
        id: remote
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          SSH_HOST: ${{ secrets.DROPLET_HOST }}
          SSH_HOST_KEY: ${{ secrets.DROPLET_HOST_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ $SSH_HOST == dex-orchestrator.best && $GITHUB_SHA =~ ^[a-f0-9]{40}$ ]]
          [[ -n $SSH_KEY && -n $SSH_HOST_KEY ]]
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          umask 077
          printf '%s\n' "$SSH_KEY" > "$work/key"
          printf '%s\n' "$SSH_HOST_KEY" > "$work/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o UserKnownHostsFile="$work/known_hosts" -i "$work/key" \
            "deploy@$SSH_HOST" "deploy $GITHUB_SHA" | tee "$work/result"
          result=$(sed -n 's/^CI_DEPLOY_RESULT=//p' "$work/result" | tail -n 1)
          case "$result" in
            deployed|noop|skipped) printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
          printf 'Deployment result for `%s`: **%s**\n' "$GITHUB_SHA" "$result" >> "$GITHUB_STEP_SUMMARY"
      - name: Report failure
        if: failure()
        run: printf '%s\n' 'Deployment failed. See the runbook in docs/rollback.md and review the droplet deploy log.' >> "$GITHUB_STEP_SUMMARY"

  retention:
    if: needs.deploy.outputs.result == 'deployed'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Prune package versions while preserving deployment aliases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/ghcr-cleanup.sh dex-orchestrator-app
          if [[ '${{ vars.DASHBOARD_AUTH_MODE }}' == auth0 ]]; then
            bash .github/scripts/ghcr-cleanup.sh dex-orchestrator-app-bff
          fi
