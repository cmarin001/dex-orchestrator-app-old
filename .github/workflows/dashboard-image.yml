name: Dashboard image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DASHBOARD_IMAGE: dex-orchestrator-app:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and start dashboard
        run: docker compose up --build --wait --wait-timeout 60
      - name: Check static routes
        run: |
          curl --fail --silent http://127.0.0.1:8081/healthz
          curl --fail --silent http://127.0.0.1:8081/ | grep -F '<div id="root">'
          curl --fail --silent http://127.0.0.1:8081/positions | grep -F '<div id="root">'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/assets/missing.js)" = 404
      - name: Save image
        run: docker image save "$DASHBOARD_IMAGE" | gzip > dashboard-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-image-${{ github.sha }}
          path: dashboard-image.tar.gz
          if-no-files-found: error
